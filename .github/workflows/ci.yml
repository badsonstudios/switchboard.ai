name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs on pushes to main only (Dan, 2026-08-06): across runs 1-6
        # its only unique signal was the known fs.watch flake, and as a
        # REQUIRED PR check it cost a re-run per sighting. Post-merge coverage
        # keeps the OS honest without gating every PR on it. Branch
        # protection's required checks list matches the PR-event matrix (4).
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest", "ubuntu-latest", "macos-latest"]') || fromJSON('["windows-latest", "ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    # Bounded on purpose - #597 (2026-08-19): CI jobs wedged in_progress for
    # HOURS with no output, one riding a PR's merge lane to the 6h job ceiling.
    # An unbounded job turns any runner-side stall into a silent merge blocker,
    # so every job in this file carries a bound. DO NOT remove these as
    # "cleanup" - the number IS the mitigation. Sized ~3-4x the slowest green
    # run observed across 26 runs on 2026-08-19 (windows 6.9 min, ubuntu 3.3,
    # macos 3.5); generous, because a bound that fires on a merely slow run is
    # a new flake.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 20 || 15 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:pty
      # Never ran anywhere until #164, which is why it rotted TWICE without a
      # red build: once when #153 made the fake honour the requested transport,
      # once when #163 put a thinking block ahead of the text one. Both are the
      # spawn-and-protocol seam the unit tests deliberately cannot reach.
      - run: npm run check:fake-stream
      # The remaining three check:* scripts are LOCAL-ONLY and deliberately have
      # no job here (#182). Each drives the REAL `claude` CLI through a real
      # model turn:
      #   check:adapter     - two headless `-p` turns: plants a marker word,
      #                       then reads it back through `--resume`
      #   check:hooks       - a real interactive session in a PTY: trust dialog,
      #                       a typed prompt, and a real Write tool call held at
      #                       the PreToolUse hook
      #   check:transcripts - a real `-p` turn, then parses the transcript the
      #                       CLI itself wrote under ~/.claude/projects
      # A runner has no subscription login, and giving it one would mean either
      # an ANTHROPIC_API_KEY or spending Dan's subscription tokens on every PR -
      # two hard constraints we do not cross (.claude/CLAUDE.md). Nor is there a
      # login-free subset worth wiring: in all three the real model turn IS the
      # thing under test, so what is left without it is already covered by the
      # unit suite. All three were run by hand on Windows against claude 2.1.220
      # for #182 and PASS, so this records a healthy decision, not a broken one.
      # `src/main/check-scripts.test.ts` enforces this comment against
      # package.json, so a NEW check script cannot land with neither a CI job
      # nor a recorded reason - which is exactly how check:fake-stream rotted
      # twice with nothing noticing (#164).

  e2e:
    name: e2e ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Bounded on purpose - #597; see the note on the build job above. This is
    # the job that actually hung: four sightings on 2026-08-19 alone (PRs #572,
    # #583, #589, #591, #599), all on `e2e ubuntu-latest`, one ~2h and one to
    # the 6h ceiling. Sized ~2.2-2.6x the slowest green run of the same 26-run
    # sample (windows 26.8 min, ubuntu 11.5). Windows e2e is genuinely slow,
    # hence the split - one bound wide enough for Windows would give the leg
    # that actually hangs nothing worth having.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 60 || 30 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Electron needs these system libs + a virtual display on headless Linux
      - name: Linux Electron deps
        if: runner.os == 'Linux'
        # THE step that wedged in #597 - every hang traced here, to an apt step
        # that runs before any test, which is why the hang never correlated
        # with spec content. A step bound turns a wedged apt mirror into a
        # 6-minute retryable failure instead of a multi-hour merge blocker.
        # Observed across the same sample: 6-117 seconds (bimodal - ~10s with a
        # warm mirror, ~1-2 min without). 6 min is ~3x the slowest. DO NOT
        # remove.
        timeout-minutes: 6
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libgtk-3-0 libgbm1 libasound2t64 libxshmfence1
      - name: e2e (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run e2e
      - name: e2e (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
