<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#e7ebf0;font-family:'IBM Plex Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:24px}
  a{color:#2563a8}a:hover{color:#1b2230}
  @keyframes spin{to{transform:rotate(360deg)}}
  .r{transition:background .11s;cursor:pointer}
  .r:hover{background:#eef1f6}
  .gh{cursor:pointer;user-select:none}
  .xb{color:#7d8695;transition:color .1s,background .1s;cursor:pointer;display:inline-flex;align-items:center;
      justify-content:center;width:18px;height:18px;border-radius:4px;line-height:1}
  .xb:hover{color:#b02722;background:rgba(176,39,34,.10)}
  .scroll::-webkit-scrollbar{width:8px}
  .scroll::-webkit-scrollbar-thumb{background:#dde1e7;border-radius:4px}
  .addg:hover{background:#f4f6f9}
</style>
</helmet>
<div style="width:286px;height:742px;background:#f4f6f9;border:1px solid #dde1e7;border-radius:9px;box-shadow:0 10px 30px rgba(20,30,50,.09);display:flex;flex-direction:column;overflow:hidden;color:#1b2230;font-size:12px">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:11px 13px 9px;flex:none;background:#fff;border-bottom:1px solid #dde1e7">
    <span style="font:600 9px 'IBM Plex Mono',monospace;letter-spacing:1.4px;color:#9098a6">SESSIONS · 10</span>
    <span class="addg" style="font:10.5px 'IBM Plex Sans',sans-serif;color:#5b6470;border:1px solid #dde1e7;border-radius:5px;padding:2px 8px;cursor:pointer">＋ group</span>
  </div>
  <div class="scroll" style="flex:1;overflow:auto;padding:10px">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
      <div style="background:#fff;border:1px solid #dde1e7;border-radius:8px;margin-bottom:9px;overflow:hidden;box-shadow:0 1px 2px rgba(20,30,50,.04)">
        <div class="gh" onClick="{{ g.toggle }}" style="{{ g.headStyle }}">
          <span style="{{ g.chev }}">▾</span>
          <span style="{{ g.folderWrap }}"><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1.9 4.1c0-.6.5-1.1 1.1-1.1h2.7c.35 0 .68.17.88.46l.7 1.04h6c.6 0 1.1.5 1.1 1.1v6c0 .6-.5 1.1-1.1 1.1H3c-.6 0-1.1-.5-1.1-1.1V4.1Z"></path></svg></span>
          <span style="font-weight:600;font-size:11.5px">{{ g.name }}</span>
          <span style="{{ g.countChip }}">{{ g.count }}</span>
          <span style="{{ g.needTag }}">{{ g.summary }}</span>
          <span style="{{ g.gTools }}"><span class="xb">⊕</span><span class="xb">✕</span></span>
        </div>
        <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
          <div style="padding:5px">
            <sc-for list="{{ g.sessions }}" as="s" hint-placeholder-count="3">
              <div class="r" onClick="{{ s.pick }}" style="{{ s.row }}">
                <span style="{{ s.bar }}"></span>
                <div style="{{ s.body }}">
                  <div style="{{ s.line1 }}"><span style="{{ s.nameStyle }}">{{ s.name }}</span></div>
                  <div style="{{ s.subStyle }}">{{ s.subText }}</div>
                </div>
                <div style="{{ s.rightCol }}">
                  <span class="xb" style="{{ s.closeBtn }}">✕</span>
                  <sc-if value="{{ s.isWorking }}" hint-placeholder-val="{{ true }}"><span style="{{ s.spinner }}"></span></sc-if>
                  <sc-if value="{{ s.notWorking }}" hint-placeholder-val="{{ false }}"><span style="{{ s.glyphBox }}">{{ s.glyph }}</span></sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <div style="flex:none;border-top:1px solid #dde1e7;background:#fff;padding:8px 13px;font:10px 'IBM Plex Mono',monospace;color:#5f6875;display:flex;justify-content:space-between">
    <span>10 sessions</span><span style="color:#8a5a06">4 need you</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;334px&quot;,&quot;height&quot;:&quot;790px&quot;}}">
class Component extends DCLogic {
  state = { sel:'moodathon', closed:{} };
  hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`; }
  // Light-theme ramp: text ink is darkened for 4.5:1 on white; dotC is the brighter hue.
  st(k){ return ({
    working:{c:'#1c62c9',l:'working'},
    input:{c:'#8a5a06',l:'needs input'},
    perm:{c:'#94500d',l:'permission'},
    done:{c:'#1a7431',l:'done'},
    idle:{c:'#5f6875',l:'idle'},
    crashed:{c:'#b02722',l:'crashed'},
  })[k]; }
  data(){
    return [
      {id:'curdev',name:'Current Dev',color:'#2f6ad9',sessions:[
        {id:'moodathon',name:'Moodathon',accent:'#e3b341',status:'working',sub:'Testing this'},
        {id:'claudemon',name:'ClaudeMon',accent:'#39c5bb',status:'input',sub:'test label'},
        {id:'plusnative',name:'PLUSNative',accent:'#a78bfa',status:'working',sub:'native bridge'},
      ]},
      {id:'general',name:'General',color:'#1a7431',sessions:[
        {id:'plusmanaged',name:'PlusManaged',accent:'#3fb950',status:'done',sub:'ready to merge'},
      ]},
      {id:'amd',name:'amd',color:'#b03b78',sessions:[
        {id:'amd1',name:'AMD',accent:'#db61a2',status:'crashed',sub:'driver probe'},
        {id:'amd2',name:'AMD',accent:'#db61a2',status:'working',sub:'session 2'},
      ]},
      {id:'shamoody',name:'shamoody',color:'#6b4fd1',sessions:[
        {id:'sham1',name:'Shamoody',accent:'#a78bfa',status:'working',sub:'atlas packer'},
        {id:'sham2',name:'Shamoody-2',accent:'#a78bfa',status:'idle',sub:''},
      ]},
      {id:'none',name:'Ungrouped',color:'#5f6875',sessions:[
        {id:'badson',name:'BadsonPropaneSensor',accent:'#39c5bb',status:'working',sub:'sensor poll'},
        {id:'pm2',name:'PlusManaged',accent:'#3fb950',status:'perm',sub:'session 2'},
      ]},
    ];
  }
  renderVals(){
    const closed=this.state.closed;
    const groups=this.data().map(g=>{
      const open=!closed[g.id];
      const need=g.sessions.filter(x=>['input','perm','crashed','done'].includes(x.status)).length;
      const sessions=g.sessions.map(s=>{
        const m=this.st(s.status);
        const needsYou=['input','perm','crashed','done'].includes(s.status);
        const isSel=this.state.sel===s.id;
        const isWorking=s.status==='working';
        const ask=({input:'Asked you a question',perm:'Wants permission to run',
          crashed:'Crashed — needs restart',done:'Finished — review changes'})[s.status];
        return {...s, sl:m.l, isWorking, notWorking:!isWorking,
          glyph:({input:'?',perm:'!',done:'✓',idle:'–',crashed:'✕'})[s.status],
          subText: needsYou? ask : (s.sub||'idle · no activity 14m'),
          pick:()=>this.setState({sel:s.id}),
          spinner:{width:'12px',height:'12px',borderRadius:'50%',flex:'none',
            border:'1.6px solid '+this.hexA(m.c,0.22),borderTopColor:m.c,animation:'spin 1.1s linear infinite'},
          bar:{position:'absolute',left:0,top:'3px',bottom:'3px',width:needsYou?'4px':'2.5px',
            borderRadius:'0 2px 2px 0',background:needsYou?m.c:(isSel?s.accent:this.hexA(s.accent,0.45))},
          row:{position:'relative',display:'flex',alignItems:'center',gap:'9px',padding:'8px 8px 8px 13px',
            borderRadius:'7px',marginBottom:'2px',
            background:needsYou?this.hexA(m.c,0.10):(isSel?this.hexA(s.accent,0.10):'transparent')},
          body:{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:'2px'},
          line1:{display:'flex',alignItems:'center',gap:'6px',minWidth:0},
          nameStyle:{fontWeight:needsYou?700:600,fontSize:'11.5px',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'},
          subStyle:{font:(needsYou?"600 9.5px 'IBM Plex Sans',sans-serif":"9.5px 'IBM Plex Mono',monospace"),
            color:needsYou?m.c:'#5f6875',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'},
          rightCol:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px',flex:'none',alignSelf:'stretch'},
          closeBtn:{font:'10px sans-serif',cursor:'pointer'},
          glyphBox:{width:'16px',height:'16px',borderRadius:'4px',flex:'none',display:'flex',alignItems:'center',
            justifyContent:'center',font:"700 10px 'IBM Plex Sans',sans-serif",color:m.c,background:this.hexA(m.c,0.14)},
        };
      });
      return {...g, open, count:g.sessions.length, sessions,
        toggle:()=>this.setState(st=>({closed:{...st.closed,[g.id]:!!open}})),
        chev:{fontSize:'8px',color:'#b3bac5',transform:open?'rotate(0deg)':'rotate(-90deg)',
          transition:'transform .12s',display:'inline-block',width:'8px',flex:'none'},
        folderWrap:{color:g.color,display:'flex',alignItems:'center',flex:'none'},
        countChip:{font:"600 9px 'IBM Plex Mono',monospace",color:g.color,background:this.hexA(g.color,0.12),
          borderRadius:'4px',padding:'1px 5px',flex:'none'},
        summary: need? need+' need you' : 'calm',
        needTag:{font:"600 9px 'IBM Plex Sans',sans-serif",color:need?'#8a5a06':'#5f6875',
          whiteSpace:'nowrap',marginLeft:'auto'},
        gTools:{display:'flex',gap:'2px',fontSize:'10px',flex:'none',alignItems:'center',marginLeft:'4px'},
        headStyle:{display:'flex',alignItems:'center',gap:'7px',padding:'8px 9px 8px 10px',
          background:this.hexA(g.color,0.07),borderBottom:'1px solid #e7eaef'},
      };
    });
    return { groups };
  }
}
</script>
</body>
</html>
