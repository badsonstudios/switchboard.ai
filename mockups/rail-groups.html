<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sessions list: telling groups apart (mock-up)</title>
<style>
  :root, .dark {
    --page: #15181e; --canvas: #242933; --card: #2b313d; --raised: #333a48; --raised-edge: #4a5366;
    --well: #1d2129; --frame: #848ea5; --divider: #3b4252; --ink: #e5e9f0; --muted: #a5aec0;
    --on-solid: #1b1f27; --auto: #8b9bc4;
    --working: #5e9fe6; --waiting: #ebcb8b; --approval: #e08a5c; --done: #8fbf7f; --idle: #7d8696; --crashed: #d97b84;
  }
  .light {
    --page: #dfe3ea; --canvas: #f4f6f9; --card: #ffffff; --raised: #ffffff; --raised-edge: #c9d0db;
    --well: #e6eaf0; --frame: #74849a; --divider: #e7eaef; --ink: #1f2430; --muted: #5d6676;
    --on-solid: #ffffff; --auto: #5a6a8f;
    --working: #2f6fc0; --waiting: #a77b12; --approval: #b8541f; --done: #3f7f35; --idle: #7d8695; --crashed: #b02722;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; }
  .bar { display: flex; gap: 16px; align-items: center; padding: 10px 16px; background: rgba(0,0,0,.25); position: sticky; top: 0; z-index: 5; backdrop-filter: blur(4px); }
  .bar h1 { font-size: 14px; margin: 0; }
  .bar button { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--divider); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .bar .hint { color: var(--muted); }
  .grid { display: flex; flex-wrap: wrap; gap: 22px; padding: 16px; }
  .cell { width: 272px; }
  .cap { margin: 0 0 8px; min-height: 66px; }
  .cap b { display: block; font-size: 13px; }
  .cap span { color: var(--muted); font-size: 11.5px; }

  /* ---------- shared rail skeleton ---------- */
  .rail { background: var(--canvas); border: 1px solid #000; border-radius: 8px; padding: 9px 8px 10px; min-height: 640px; }
  .top { display: flex; align-items: center; gap: 6px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0 2px 9px; }
  .top .sp { flex: 1; }
  .top .b { text-transform: none; letter-spacing: 0; border: 1px solid var(--divider); border-radius: 5px; padding: 1px 6px; font-size: 11px; color: var(--ink); background: var(--card); }
  .grp { margin-bottom: 9px; position: relative; }
  .gh { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; row-gap: 3px; padding: 7px 9px 7px 10px; cursor: pointer; user-select: none; }
  .caret { font-size: 8px; color: var(--muted); width: 8px; margin-right: 7px; }
  .grp.closed .caret { transform: rotate(-90deg); }
  .gdot { width: 9px; height: 9px; border-radius: 50%; background: var(--g); margin-right: 7px; }
  .grp[data-k="auto"] .gdot { background: none; width: auto; height: auto; border-radius: 0; font-size: 11px; }
  .grp[data-k="auto"] .gdot::before { content: "\1F4C1"; }
  .grp[data-k="none"] .gdot { display: none; }
  .gname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gbtns { color: var(--muted); font-size: 11px; letter-spacing: 4px; }
  .grp[data-k="auto"] .gbtns, .grp[data-k="none"] .gbtns { visibility: hidden; }
  .gchips { grid-column: 3 / 5; font-size: 10.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .auto-badge { font-size: 9px; font-weight: 700; letter-spacing: .05em; border: 1px solid var(--auto); color: var(--auto); border-radius: 3px; padding: 0 3px; }
  .c-appr { color: var(--approval); } .c-wait { color: var(--waiting); }
  .gb { padding: 3px 4px 5px; }
  .grp.closed .gb { display: none; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 5px; }
  .sdot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--idle); }
  .row[data-s="working"] .sdot { background: none; border: 2px solid var(--working); border-right-color: transparent; }
  .row[data-s="waiting"] .sdot { background: var(--waiting); }
  .row[data-s="approval"] .sdot { background: var(--approval); }
  .row[data-s="done"] .sdot { background: var(--done); }
  .row[data-s="waiting"], .row[data-s="approval"] { box-shadow: inset 3px 0 0 var(--wc); }
  .row[data-s="waiting"] { --wc: var(--waiting); } .row[data-s="approval"] { --wc: var(--approval); }
  .rn { flex: 1; min-width: 0; }
  .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task { font-size: 10.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .st { font-size: 10.5px; color: var(--muted); }
  .row.sel { background: var(--raised); }

  /* ---------- 0 · today ---------- */
  .v0 .grp { background: var(--card); border: 1px solid var(--frame); border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .v0 .gh { background: color-mix(in srgb, var(--g) 7%, var(--card)); border-bottom: 1px solid var(--divider); border-radius: 7px 7px 0 0; }
  .v0 .grp.closed .gh { border-radius: 7px; border-bottom: 0; }
  .v0 .grp[data-k="auto"] { background: color-mix(in srgb, var(--auto) 7%, var(--card)); }
  .v0 .grp[data-k="auto"] .gh { background: color-mix(in srgb, var(--auto) 16%, var(--card)); }
  .v0 .gname { color: color-mix(in srgb, var(--g) 70%, var(--ink)); }

  /* ---------- 1 · coloured frame ---------- */
  .v1 .grp { background: var(--card); border: 2px solid var(--g); border-radius: 9px; }
  .v1 .gh { background: color-mix(in srgb, var(--g) 22%, var(--card)); border-radius: 7px 7px 0 0; }
  .v1 .grp.closed .gh { border-radius: 7px; }
  .v1 .gname { color: var(--ink); }
  .v1 .grp[data-k="none"] { background: transparent; border: 1px dashed var(--muted); }
  .v1 .grp[data-k="none"] .gh { background: transparent; }
  .v1 .grp[data-k="none"] .gname { color: var(--muted); font-weight: 500; }

  /* ---------- 2 · colour spine ---------- */
  .v2 .grp { background: var(--card); border-left: 5px solid var(--g); border-radius: 3px 8px 8px 3px; margin-bottom: 14px; }
  .v2 .gh { padding-left: 8px; }
  .v2 .gname { color: color-mix(in srgb, var(--g) 75%, var(--ink)); text-transform: uppercase; letter-spacing: .06em; font-size: 11.5px; }
  .v2 .gb { padding-left: 10px; }
  .v2 .grp[data-k="none"] { background: transparent; border-left: 5px solid transparent; }
  .v2 .grp[data-k="none"] .gname { color: var(--muted); }

  /* ---------- 3 · solid header ---------- */
  .v3 .grp { background: var(--card); border: 1px solid color-mix(in srgb, var(--g) 55%, var(--divider)); border-radius: 8px; overflow: hidden; }
  .v3 .gh { background: var(--g); }
  .v3 .gh, .v3 .gh .caret, .v3 .gh .gbtns, .v3 .gh .gchips, .v3 .gh .c-appr, .v3 .gh .c-wait { color: var(--on-solid); }
  .v3 .gh .auto-badge { color: var(--on-solid); border-color: var(--on-solid); }
  .v3 .gdot { background: var(--on-solid); }
  .v3 .gh .c-appr::before, .v3 .gh .c-wait::before { content: "\25CF  "; }
  .v3 .gh .c-appr::before { color: var(--on-solid); }
  .v3 .grp[data-k="none"] { border-color: var(--divider); }
  .v3 .grp[data-k="none"] .gh { background: var(--raised); }
  .v3 .grp[data-k="none"] .gh, .v3 .grp[data-k="none"] .gh * { color: var(--muted); }

  /* ---------- 4 · folder tab ---------- */
  .v4 .grp { margin-bottom: 12px; }
  .v4 .gh { display: inline-grid; min-width: 78%; max-width: 100%; background: color-mix(in srgb, var(--g) 28%, var(--card)); border: 2px solid var(--g); border-bottom: 0; border-radius: 7px 7px 0 0; padding: 4px 9px 4px 8px; position: relative; top: 2px; }
  .v4 .gchips { grid-column: 3 / 5; }
  .v4 .gb { background: var(--card); border: 2px solid var(--g); border-radius: 0 8px 8px 8px; }
  .v4 .grp.closed .gh { border-bottom: 2px solid var(--g); border-radius: 7px; top: 0; }
  .v4 .grp[data-k="none"] .gh { border-style: dashed; border-color: var(--muted); background: transparent; color: var(--muted); }
  .v4 .grp[data-k="none"] .gb { border-style: dashed; border-color: var(--muted); background: transparent; }

  /* ---------- 5 · tree with guide line ---------- */
  .v5 .grp { margin-bottom: 4px; padding-bottom: 6px; border-bottom: 1px solid var(--divider); }
  .v5 .gh { padding: 6px 4px; }
  .v5 .gname { color: color-mix(in srgb, var(--g) 80%, var(--ink)); }
  .v5 .gb { margin-left: 8px; border-left: 2px solid color-mix(in srgb, var(--g) 70%, transparent); padding: 0 0 0 6px; }
  .v5 .grp[data-k="none"] { border-bottom: 0; }
  .v5 .grp[data-k="none"] .gh { display: none; }
  .v5 .grp[data-k="none"] .gb { margin-left: 0; border-left: 0; padding: 4px 0 0; }

  /* ---------- 6 · wells + raised sessions ---------- */
  .v6 .grp { background: var(--well); border: 1px solid color-mix(in srgb, var(--g) 50%, var(--divider)); border-radius: 10px; box-shadow: inset 0 2px 6px rgba(0,0,0,.35); margin-bottom: 11px; }
  .light .v6 .grp { box-shadow: inset 0 2px 5px rgba(20,30,50,.12); }
  .v6 .gname { color: color-mix(in srgb, var(--g) 80%, var(--ink)); }
  .v6 .gb { padding: 0 6px 6px; }
  .v6 .row { background: var(--raised); border: 1px solid var(--raised-edge); border-radius: 6px; margin-bottom: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  .v6 .row.sel { outline: 2px solid var(--working); outline-offset: -1px; }
  .v6 .grp[data-k="none"] { background: transparent; border: 0; box-shadow: none; }
  .v6 .grp[data-k="none"] .gh { display: none; }
  .v6 .grp[data-k="none"] .gb { padding: 0; }

  /* ---------- 7 · two outline colours (group thick + colour, session thin + neutral) ---------- */
  .v7 .grp { background: color-mix(in srgb, var(--g) 6%, var(--canvas)); border: 2px solid var(--g); border-radius: 10px; margin-bottom: 12px; }
  .v7 .gh { padding-bottom: 5px; }
  .v7 .gname { color: var(--ink); }
  .v7 .gb { padding: 0 6px 6px; }
  .v7 .row { background: var(--card); border: 1px solid var(--raised-edge); border-radius: 6px; margin-bottom: 4px; }
  .v7 .row.sel { border-color: var(--working); }
  .v7 .grp[data-k="none"] { background: transparent; border: 0; }
  .v7 .grp[data-k="none"] .gh { padding-left: 2px; }
  .v7 .grp[data-k="none"] .gname { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  .v7 .grp[data-k="none"] .gb { padding: 0; }

  /* ---------- 8 · header bar + count, sessions inset ---------- */
  .v8 .grp { margin-bottom: 14px; }
  .v8 .gh { border-radius: 6px; background: color-mix(in srgb, var(--g) 18%, var(--canvas)); box-shadow: inset 0 -2px 0 var(--g); }
  .v8 .gname { font-size: 13px; }
  .v8 .gb { margin: 4px 0 0 14px; background: var(--card); border-radius: 6px; border: 1px solid var(--divider); }
  .v8 .grp[data-k="none"] .gh { background: transparent; box-shadow: inset 0 -1px 0 var(--divider); color: var(--muted); }
  .v8 .grp[data-k="none"] .gname { font-size: 12px; font-weight: 500; }
  .v8 .grp[data-k="none"] .gb { margin-left: 0; }
</style>
</head>
<body class="dark">
<div class="bar">
  <h1>Sessions list: telling groups apart</h1>
  <button id="theme">Switch to light theme</button>
  <span class="hint">Click a group header to fold it. Every list shows the same sessions: two groups you made, one automatic folder group, one folded group, and two sessions in no group.</span>
</div>
<div class="grid" id="grid"></div>

<script>
  var VARIANTS = [
    ['v0', '0 · Today (for reference)', 'Every container gets the same thin grey frame. A group differs only by a 7% tint of its colour on the header, and "No group" looks like any other group.'],
    ['v1', '1 · Coloured frame', 'Each group is outlined in its own colour, 2px, with a stronger header tint. "No group" becomes a dashed grey outline with no fill, so it reads as "not a group".'],
    ['v2', '2 · Colour spine', 'No outline. A thick bar in the group colour runs down the left of the whole group, the name is set in small capitals, and the sessions are indented under it.'],
    ['v3', '3 · Solid header', 'The header is filled solid with the group colour, like a label strip. Sessions sit on a plain card below it. The strongest "this is a group" signal.'],
    ['v4', '4 · Folder tab', 'The header becomes a tab sticking up from a coloured folder. Very obviously a container; it costs a little height per group.'],
    ['v5', '5 · Tree with guide line', 'No boxes at all, like a file tree. Each group’s sessions hang off a coloured guide line; ungrouped sessions sit flush left with no line.'],
    ['v6', '6 · Wells and raised sessions', 'Groups are sunken trays and each session is its own raised card inside one. Group and session can never be mistaken for each other.'],
    ['v7', '7 · Two outline colours', 'Your idea: groups get a thick outline in their colour; every session gets a thin neutral outline of its own. Ungrouped sessions keep their thin outline under a plain caption.'],
    ['v8', '8 · Heading bar, indented sessions', 'The group is a heading bar with a coloured underline, and its sessions sit in an indented panel beneath it. Reads like a document outline.']
  ];
  var GROUPS = [
    { k: 'user', name: 'Switchboard', g: '#5e9fe6', chips: '<span class="c-appr">1 approval</span> · <span class="c-wait">1 waiting</span>', rows: [
      ['switchboard.ai', 'Session sticky notes (#1544)', 'working', 'working', true],
      ['sb-wt-1', 'Fix history round trip', 'approval', 'approval'],
      ['sb-wt-2', 'Rail group contrast', 'waiting', 'waiting'] ] },
    { k: 'user', name: 'Client work', g: '#d08770', chips: 'calm', rows: [
      ['PropaneMon', 'Sensor poll interval', 'idle', 'idle'],
      ['GpuMon', 'NVML fan curves', 'done', 'done'] ] },
    { k: 'auto', name: 'BrainHarbor', g: '#8b9bc4', auto: true, chips: '<span class="auto-badge">AUTO</span> 1 working', rows: [
      ['BrainHarbor', 'v2 API migration', 'working', 'working'],
      ['BrainHarbor (2)', 'Release notes', 'idle', 'idle'] ] },
    { k: 'user', name: 'Side projects', g: '#b48ead', closed: true, chips: 'calm · 3 sessions', rows: [
      ['ClaudeMon', '', 'idle', 'idle'] ] },
    { k: 'none', name: 'No group', g: '#a5aec0', chips: '', rows: [
      ['ClaudeTemplates', 'Template refresh', 'idle', 'idle'],
      ['plans', 'Q1 roadmap', 'done', 'done'] ] }
  ];
  function rail(v) {
    var h = '<div class="rail ' + v + '"><div class="top">Sessions<span class="sp"></span><span class="b">+ session</span><span class="b">+ group</span></div>';
    GROUPS.forEach(function (g, i) {
      h += '<div class="grp' + (g.closed ? ' closed' : '') + '" data-k="' + g.k + '" style="--g:' + g.g + '">' +
        '<div class="gh" data-i="' + i + '"><span class="caret">▼</span><span class="gdot"></span><span class="gname">' + g.name + '</span>' +
        '<span class="gbtns">⚙⊕✕</span>' + (g.chips ? '<div class="gchips">' + g.chips + '</div>' : '') + '</div><div class="gb">';
      g.rows.forEach(function (r) {
        h += '<div class="row' + (r[4] ? ' sel' : '') + '" data-s="' + r[2] + '"><span class="sdot"></span><div class="rn"><div class="name">' + r[0] + '</div>' +
          (r[1] ? '<div class="task">' + r[1] + '</div>' : '') + '</div><span class="st">' + r[3] + '</span></div>';
      });
      h += '</div></div>';
    });
    return h + '</div>';
  }
  document.getElementById('grid').innerHTML = VARIANTS.map(function (v) {
    return '<div class="cell"><p class="cap"><b>' + v[1] + '</b><span>' + v[2] + '</span></p>' + rail(v[0]) + '</div>';
  }).join('');
  document.addEventListener('click', function (e) {
    var gh = e.target.closest('.gh');
    if (gh) gh.parentNode.classList.toggle('closed');
    if (e.target.id === 'theme') {
      var light = document.body.classList.toggle('light');
      document.body.classList.toggle('dark', !light);
      e.target.textContent = light ? 'Switch to dark theme' : 'Switch to light theme';
    }
  });
</script>
</body>
</html>
